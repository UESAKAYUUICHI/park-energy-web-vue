name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ForAI/source
    steps:
      - uses: actions/checkout@v6
        with:
          path: ForAI/source
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --cache ../cache/npm
      - run: npm run build
